name: Run Fast Hybrid Pro on Google Colab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Fast_Hybrid_Pro.ipynb"

permissions:
  contents: write

jobs:
  run-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google Colab CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/googlecolab/google-colab-cli.git"

      - name: Configure Colab CLI credentials
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          if [ -z "${COLAB_CLI_TOKEN_JSON:-}" ]; then
            echo "::error::Missing GitHub secret COLAB_CLI_TOKEN_JSON"
            echo "Create the secret from the one-time Colab CLI OAuth token before running this workflow."
            exit 1
          fi
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"

      - name: Run notebook on a fresh Colab runtime
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -euo pipefail
          SESSION="fast-hybrid-pro-${GITHUB_RUN_ID}"
          trap 'colab --auth=oauth2 stop -s "$SESSION" || true' EXIT

          colab --auth=oauth2 new -s "$SESSION"
          colab --auth=oauth2 exec -s "$SESSION" -f Fast_Hybrid_Pro.ipynb

          test -f Fast_Hybrid_Pro_output.ipynb
          mkdir -p results
          cp Fast_Hybrid_Pro_output.ipynb results/Fast_Hybrid_Pro_latest.ipynb
          colab --auth=oauth2 log -s "$SESSION" -o results/Fast_Hybrid_Pro_execution_log.ipynb

      - name: Validate executed notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("results/Fast_Hybrid_Pro_latest.ipynb")
          nb = json.loads(p.read_text(encoding="utf-8"))

          errors = []
          executed = 0
          for i, cell in enumerate(nb.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              if cell.get("execution_count") is not None:
                  executed += 1
              for out in cell.get("outputs", []):
                  if out.get("output_type") == "error":
                      errors.append(
                          f"cell {i}: {out.get('ename', 'Error')}: {out.get('evalue', '')}"
                      )

          print(f"Executed code cells: {executed}")
          if errors:
              print("Notebook errors:")
              for e in errors:
                  print(e)
              raise SystemExit(1)

          print("NOTEBOOK_EXECUTION_VALID")
          PY

      - name: Commit execution results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/Fast_Hybrid_Pro_latest.ipynb results/Fast_Hybrid_Pro_execution_log.ipynb
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "chore: save Colab execution results"
            git push
          fi
