name: Run Fast Hybrid Pro on Google Colab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Fast_Hybrid_Pro.ipynb"

permissions:
  contents: write

concurrency:
  group: fast-hybrid-pro-colab
  cancel-in-progress: true

jobs:
  run-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google Colab CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/googlecolab/google-colab-cli.git"

      - name: Configure Google ADC credentials
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${COLAB_ADC_JSON:-}" ]; then
            echo "::error::Missing GitHub secret COLAB_ADC_JSON"
            echo "Add the Google Application Default Credentials JSON as a GitHub Actions secret."
            exit 1
          fi

          printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/adc.json"
          chmod 600 "$RUNNER_TEMP/adc.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/adc.json" >> "$GITHUB_ENV"

      - name: Verify Colab authentication
        run: |
          set -euo pipefail
          colab --auth=adc whoami

      - name: Run notebook on a fresh Colab runtime
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -euo pipefail
          SESSION="fast-hybrid-pro-${GITHUB_RUN_ID}"

          cleanup() {
            colab --auth=adc stop -s "$SESSION" || true
          }
          trap cleanup EXIT

          colab --auth=adc new -s "$SESSION"
          mkdir -p results
          if [ -f results/production_signal_journal.csv ]; then
            colab --auth=adc upload -s "$SESSION" results/production_signal_journal.csv /content/production_signal_journal.csv
          fi
          colab --auth=adc exec --timeout 900 -s "$SESSION" -f Fast_Hybrid_Pro.ipynb

          test -f Fast_Hybrid_Pro_output.ipynb
          mkdir -p results
          cp Fast_Hybrid_Pro_output.ipynb results/Fast_Hybrid_Pro_latest.ipynb
          colab --auth=adc log -s "$SESSION" -o results/Fast_Hybrid_Pro_execution_log.ipynb
          colab --auth=adc download -s "$SESSION" /content/production_signal_journal.csv results/production_signal_journal.csv

      - name: Persist raw execution outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/Fast_Hybrid_Pro_latest.ipynb results/Fast_Hybrid_Pro_execution_log.ipynb
          git add -f results/production_signal_journal.csv
          if git diff --cached --quiet; then
            echo "No raw execution changes to commit."
          else
            git commit -m "chore: save raw Colab execution output"
            git push
          fi

      - name: Validate executed notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("results/Fast_Hybrid_Pro_latest.ipynb")
          if not p.exists():
              raise SystemExit("Missing executed notebook output")

          nb = json.loads(p.read_text(encoding="utf-8"))

          errors = []
          executed = 0
          for i, cell in enumerate(nb.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              if cell.get("execution_count") is not None:
                  executed += 1
              for out in cell.get("outputs", []):
                  if out.get("output_type") == "error":
                      errors.append(
                          f"cell {i}: {out.get('ename', 'Error')}: {out.get('evalue', '')}"
                      )

          print(f"Executed code cells: {executed}")

          if errors:
              print("Notebook errors:")
              for error in errors:
                  print(error)
              raise SystemExit(1)

          print("NOTEBOOK_EXECUTION_VALID")
          PY

      - name: Commit execution results
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/Fast_Hybrid_Pro_latest.ipynb results/Fast_Hybrid_Pro_execution_log.ipynb
          git add -f results/production_signal_journal.csv

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "chore: save Colab execution results"
            git push
          fi
